[package]
name = "larql-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "HTTP server for vindex knowledge queries and inference"

[[bin]]
name = "larql-server"
path = "src/main.rs"

[dependencies]
larql-core = { path = "../larql-core", features = ["http-async"], optional = true }
larql-vindex = { path = "../larql-vindex", optional = true }
larql-inference = { path = "../larql-inference" }
larql-models = { path = "../larql-models" }
larql-tokenizer = { path = "../larql-tokenizer" }

axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

clap = { version = "4", features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

[features]
default = ["http-async", "huggingface"]
http-async = ["dep:larql-core", "larql-core/http-async", "dep:larql-vindex"]
huggingface = ["dep:larql-core", "larql-core/huggingface", "dep:larql-vindex", "larql-vindex/huggingface"]

[package.metadata.product]
zone = "interface"
role = "network-api-service-surface"
release_impact = "critical"
stability_target = "stable"
