[package]
name = "larql-python"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Python bindings for LARQL knowledge graph engine and vindex"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
larql-core = { path = "../larql-core" }
larql-inference = { path = "../larql-inference" }
larql-models = { path = "../larql-models" }
larql-vindex = { path = "../larql-vindex" }
larql-tokenizer = { path = "../larql-tokenizer" }
larql-lql = { path = "../larql-lql" }
pyo3 = { version = "0.26", features = ["extension-module", "abi3-py310"] }
numpy = "0.26"
ndarray = { path = "../larql-tensor", package = "larql-tensor" }
serde = { workspace = true }
serde_json = { workspace = true }

[package.metadata.product]
zone = "interface"
role = "python-sdk-and-ui-integration"
release_impact = "critical"
stability_target = "managed"
