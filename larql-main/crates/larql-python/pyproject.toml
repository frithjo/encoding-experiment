[build-system]
requires = ["maturin>=1.7"]
build-backend = "maturin"

[project]
name = "larql"
version = "0.1.0"
description = "Python bindings for LARQL — the queryable model format"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = []
keywords = ["knowledge-graph", "llm", "interpretability", "vindex", "mechanistic-interpretability"]
dependencies = [
    "numpy>=1.26",
]

[project.scripts]
larql-ui = "larql.ui.__main__:main"

[project.optional-dependencies]
mlx = ["mlx-lm"]
ui = [
    "fastapi>=0.136.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.26",
    "uvicorn>=0.44.0",
]

[dependency-groups]
dev = [
    "fastapi>=0.136.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "maturin>=1.7",
    "numpy>=1.26",
    "pytest>=8",
    "python-multipart>=0.0.26",
    "uvicorn>=0.44.0",
]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "larql._native"
python-source = "python"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
