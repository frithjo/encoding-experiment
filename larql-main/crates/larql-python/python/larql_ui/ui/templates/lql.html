{% extends "base.html" %}

{% block content %}
<h1 class="page-title">LQL Console</h1>

<form method="post" class="task-form" id="lql-form">
  <label for="query">Query</label>
  <textarea id="query" name="query" rows="8" placeholder="STATS or DESCRIBE ...">{{ query }}</textarea>
  <div class="checkbox-row">
    <input type="checkbox" id="lql_async_background" name="async_background" {% if async_background %}checked{% endif %}>
    <label for="lql_async_background">Background run</label>
  </div>
  
  <button type="submit" class="submit-button">Run query <kbd>Ctrl+Enter</kbd></button>
</form>

<section class="panel result-panel" id="lql-async-panel" hidden>
  <h2>Background Result</h2>
  <p class="muted" id="lql-async-status">Waiting...</p>
  <div id="lql-async-result"></div>
</section>

{% include "partials/lql_result.html" %}

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const form = document.getElementById('lql-form');
    const asyncCheckbox = document.getElementById('lql_async_background');
    const panel = document.getElementById('lql-async-panel');
    const statusEl = document.getElementById('lql-async-status');
    const resultEl = document.getElementById('lql-async-result');

    function asyncClient() {
      return window.LarqlAsyncRuns || null;
    }

    function renderMissingClientError() {
      if (!panel || !statusEl || !resultEl) return;
      panel.hidden = false;
      statusEl.textContent = "Background run unavailable.";
      resultEl.innerHTML = '<p class="banner error" role="alert">Async client failed to load.</p>';
    }

    if (!form || !asyncCheckbox) return;
    form.addEventListener('submit', function (event) {
      if (!asyncCheckbox.checked) return;
      const client = asyncClient();
      if (!client) {
        event.preventDefault();
        renderMissingClientError();
        return;
      }
      event.preventDefault();
      const fd = new FormData(form);
      client.submitAndPoll({
        scope: "lql-page",
        url: "/api/lql/query",
        body: {
          async: true,
          query: String(fd.get("query") || "")
        },
        panel,
        statusEl,
        resultEl,
        resultUrlBuilder: function (rid) {
          return "/partials/lql-result?run_id=" + encodeURIComponent(rid);
        }
      });
    });
  });
</script>
{% endblock %}
