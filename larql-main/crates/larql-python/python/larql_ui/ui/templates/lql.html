{% extends "base.html" %}

{% block content %}
<h1 class="page-title">LQL Console</h1>

<form method="post" class="task-form" id="lql-form">
  <label for="query">Query</label>
  <textarea id="query" name="query" rows="8" placeholder="STATS or DESCRIBE ...">{{ query }}</textarea>
  
  <button type="submit" class="submit-button">Run query <kbd>Ctrl+Enter</kbd></button>
</form>

{% if run %}
<section class="panel result-panel">
  <h2>Result</h2>
  <div class="muted">{{ run.summary }} | {{ run.duration_ms }} ms</div>
  <pre>{% for line in run.raw.lines %}{{ line }}
{% endfor %}</pre>
  <details class="tty-details">
    <summary>Raw JSON</summary>
    <pre>{{ run.raw|to_pretty_json }}</pre>
  </details>
</section>
{% endif %}
{% endblock %}
