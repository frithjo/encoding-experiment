[package]
name = "larql-terminal-batch-dla"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.32", features = ["full"] }
ratatui = "0.26"
crossterm = "0.27"
larql-terminal-renderer = { path = "../larql-terminal-renderer" }
