[package]
name = "larql-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core graph engine for LARQL — knowledge graphs extracted from neural network weights"
keywords = ["knowledge-graph", "llm", "interpretability", "graph"]
categories = ["data-structures", "science"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
libc = "0.2"
config = "0.14"
dotenvy = "0.15"
dirs = "5.0"

# HTTP provider — optional so pure graph usage has zero network deps
reqwest = { version = "0.12", features = ["blocking", "json"], optional = true }

# HuggingFace Hub integration — consolidated here to avoid duplicate deps
hf-hub = { version = "0.5", optional = true }

# Binary serialization via MessagePack
rmp-serde = { version = "1", optional = true }

[features]
default = ["http", "msgpack"]
http = ["dep:reqwest"]
http-async = ["dep:reqwest", "reqwest?/default"]
huggingface = ["dep:hf-hub", "http"]
msgpack = ["dep:rmp-serde"]

[dev-dependencies]
assert_approx_eq = "1"
tempfile = "3"

[package.metadata.product]
zone = "core"
role = "shared-graph-and-io-primitives"
release_impact = "high"
stability_target = "stable"
