[package]
name = "larql-inference"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Transformer inference engine — forward pass, attention, FFN, layer norm from safetensors weights"
keywords = ["transformer", "inference", "llm", "interpretability"]
categories = ["science"]

[dependencies]
larql-models = { path = "../larql-models" }
larql-compute = { path = "../larql-compute" }
larql-core = { path = "../larql-core" }
larql-vindex = { path = "../larql-vindex" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# System
libc = "0.2"

# Matrix ops (BLAS-accelerated). Routed through larql-tensor facade.
ndarray = { path = "../larql-tensor", package = "larql-tensor" }

# Tokenizer contract (HF impl is the default; see larql-tokenizer).
larql-tokenizer = { path = "../larql-tokenizer" }

[features]
default = []
metal = ["larql-compute/metal"]

[dev-dependencies]
assert_approx_eq = "1"
tempfile = "3"
