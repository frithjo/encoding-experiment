[package]
name = "larql-lql"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "LQL parser, executor, and REPL for LARQL"

[dependencies]
larql-core = { path = "../larql-core", features = ["http"] }
larql-inference = { path = "../larql-inference" }
larql-models = { path = "../larql-models" }
larql-tokenizer = { path = "../larql-tokenizer" }
larql-vindex = { path = "../larql-vindex" }
rustyline = "15"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "parser"
harness = false

[[bench]]
name = "executor"
harness = false

[[bench]]
name = "compile"
harness = false
