[package]
name = "larql-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "CLI for LARQL knowledge graph extraction and querying"

[[bin]]
name = "larql"
path = "src/main.rs"

[dependencies]
larql-core = { path = "../larql-core", features = ["http"] }
larql-governance = { path = "../larql-governance" }
larql-inference = { path = "../larql-inference" }
larql-models = { path = "../larql-models" }
larql-vindex = { path = "../larql-vindex" }
larql-lql = { path = "../larql-lql" }
larql-tokenizer = { path = "../larql-tokenizer" }
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.17"
thiserror = { workspace = true }
anyhow = "1"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = "0.10"
toml = "0.8"

[package.metadata.product]
zone = "interface"
role = "user-cli-surface"
release_impact = "critical"
stability_target = "stable"
