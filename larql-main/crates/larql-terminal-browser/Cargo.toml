[package]
name = "larql-terminal-browser"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "First-party terminal browser for the LARQL workbench (Rust-first client)"
repository.workspace = true

[[bin]]
name = "larql-terminal-browser"
path = "src/main.rs"

[dependencies]
larql-core = { path = "../larql-core" }
larql-tty-io = { path = "../larql-tty-io" }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "full"] }
dirs = "5.0"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.29", features = ["event-stream"] }
nix = { version = "0.29", features = ["process", "signal"] }
serde = { version = "1.0", features = ["derive"] }

[package.metadata.product]
zone = "interface"
role = "terminal-workbench-ux-surface"
release_impact = "medium"
stability_target = "iterative"
