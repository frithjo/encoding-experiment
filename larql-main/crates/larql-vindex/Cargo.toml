[package]
name = "larql-vindex"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Vindex — the queryable model format. Storage, KNN index, build, load, mutate."
keywords = ["transformer", "vindex", "knn", "interpretability"]
categories = ["science"]

[dependencies]
larql-models = { path = "../larql-models" }
larql-compute = { path = "../larql-compute" }
larql-core = { path = "../larql-core" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# Matrix types (all compute via larql-compute). Routed through larql-tensor facade.
ndarray = { path = "../larql-tensor", package = "larql-tensor" }

# Tokenizer contract (HF impl is the default; see larql-tokenizer).
larql-tokenizer = { path = "../larql-tokenizer" }

# Checksums
sha2 = "0.10"

# System
libc = "0.2"
dirs = "5.0"
time = { version = "0.3", features = ["formatting"] }

# HuggingFace Hub integration (optional - knowledge format is HF-agnostic)
[features]
default = ["huggingface"]
metal = ["larql-compute/metal"]
huggingface = ["larql-core/huggingface"]

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "vindex_ops"
harness = false

[[bench]]
name = "vindex_scaling"
harness = false

[package.metadata.product]
zone = "core"
role = "vindex-storage-query-and-patch-lifecycle"
release_impact = "high"
stability_target = "stable"
