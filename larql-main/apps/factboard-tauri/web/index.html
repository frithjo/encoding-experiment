<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LARQL Factoid Board</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 16px; background: #041b21; color: #edf7f1; }
    pre { background: #06232b; border: 1px solid #1f4d56; border-radius: 8px; padding: 12px; overflow: auto; }
  </style>
</head>
<body>
  <h1>LARQL Factoid Board (Tauri host)</h1>
  <p>Projection data is generated by Rust and rendered by the UI.</p>
  <pre id="projection">loading...</pre>
  <script type="module">
    const projectionNode = document.getElementById("projection");
    try {
      const { invoke } = window.__TAURI__.core;
      const projection = await invoke("factoid_board_projection");
      projectionNode.textContent = JSON.stringify(projection, null, 2);
    } catch (err) {
      projectionNode.textContent = `Unable to load projection: ${String(err)}`;
    }
  </script>
</body>
</html>
