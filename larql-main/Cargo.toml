[workspace]
resolver = "2"
members = [
    "crates/larql-models",
    "crates/larql-compute",
    "crates/larql-core",
    "crates/larql-tokenizer",
    "crates/larql-vindex",
    "crates/larql-inference",
    "crates/larql-lql",
    "crates/larql-cli",
    "crates/larql-server",
    "crates/larql-python",
    "crates/larql-terminal-browser",
    "crates/kv-cache-benchmark",
    "crates/larql-tensor",
]
default-members = [
    "crates/larql-models",
    "crates/larql-compute",
    "crates/larql-core",
    "crates/larql-tokenizer",
    "crates/larql-vindex",
    "crates/larql-inference",
    "crates/larql-lql",
    "crates/larql-cli",
    "crates/larql-server",
    "crates/kv-cache-benchmark",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = []
license = "Apache-2.0"
repository = "https://github.com/chrishayuk/chuk-larql-rs"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.features]
default = []
# HTTP dependencies - enables network functionality across crates
http = ["larql-core/http", "larql-lql/http", "larql-cli/http"]
# Async HTTP for server use cases
http-async = ["larql-core/http-async", "larql-server/http-async"]
# HuggingFace integration - consolidated in larql-core
huggingface = ["larql-core/huggingface", "larql-vindex/huggingface", "larql-server/huggingface"]
# Metal GPU backend (Apple Silicon)
metal = ["larql-compute/metal", "larql-inference/metal", "larql-vindex/metal"]
