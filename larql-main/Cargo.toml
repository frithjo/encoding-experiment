[workspace]
resolver = "2"
members = [
    "crates/larql-models",
    "crates/larql-compute",
    "crates/larql-core",
    "crates/larql-governance",
    "crates/larql-tokenizer",
    "crates/larql-vindex",
    "crates/larql-inference",
    "crates/larql-lql",
    "crates/larql-cli",
    "crates/larql-server",
    "crates/larql-python",
    "crates/larql-terminal-browser",
    "experiments/kv-cache-benchmark",
    "crates/larql-tensor",
    "crates/larql-leptos",
    "crates/larql-terminal-batch-dla",
    "crates/larql-terminal-renderer",
    "crates/larql-tty-io",
    "crates/larql-factboard",
    "crates/larql-policy-engine-projection",
]
default-members = [
    "crates/larql-models",
    "crates/larql-compute",
    "crates/larql-core",
    "crates/larql-governance",
    "crates/larql-tokenizer",
    "crates/larql-vindex",
    "crates/larql-inference",
    "crates/larql-lql",
    "crates/larql-cli",
    "crates/larql-server",
    "experiments/kv-cache-benchmark",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = []
license = "Apache-2.0"
repository = "https://github.com/chrishayuk/chuk-larql-rs"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
ndarray = "0.16"
larql-core = { path = "crates/larql-core" }
