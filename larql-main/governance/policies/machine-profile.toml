schema_version = "larql.governance.policy_pack.v1"

[[rule]]
id = "profile.machine_arbitrary_file_edit.forbidden"
class = "runtime_policy"
severity = "deny"
description = "Machine profiles may not allow arbitrary file edits."
when = { all = [{ action = "verify_governance_rule_profile" }, { fact = "profile.allow_machine_edit_arbitrary_files_freely", equals = true }] }
require = { all = [{ evidence = "profile_forbidden_authority_review", present = true }] }
decision = { on_missing = "deny", message = "Governance rule profile allows arbitrary machine file edits.", required_actions = ["disable allow_machine_edit_arbitrary_files_freely"] }

