name: Security

on:
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
    paths:
      - "larql-main/Cargo.lock"
      - "larql-main/Cargo.toml"
      - "larql-main/crates/**/Cargo.toml"
      - ".github/workflows/security.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-audit:
    name: Cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: larql-main
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: larql-main -> target

      - name: Generate lockfile
        run: cargo generate-lockfile

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit (JSON report)
        run: cargo audit --json > cargo-audit-report.json

      - name: Upload cargo-audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cargo-audit-report
          path: larql-main/cargo-audit-report.json

  cargo-deny:
    name: Cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: larql-main
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: larql-main -> target

      - name: Generate lockfile
        run: cargo generate-lockfile

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Run cargo deny (JSON report)
        run: cargo deny --manifest-path Cargo.toml check --config deny.toml --format json > cargo-deny-report.json

      - name: Upload cargo-deny report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cargo-deny-report
          path: larql-main/cargo-deny-report.json
