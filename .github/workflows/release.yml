name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      confirm_release:
        description: "Set to true to allow manual publish"
        required: true
        default: "false"

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build release artifacts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: larql-main
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive_ext: tar.gz
          - os: macos-latest
            archive_ext: tar.gz
          - os: windows-latest
            archive_ext: zip
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: larql-main -> target

      - name: Build release binaries
        run: cargo build --release -p larql-cli -p larql-server

      - name: Package binaries (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF_NAME:-manual}"
          ARCHIVE_BASENAME="larql-${TAG_NAME}-${RUNNER_OS}-${RUNNER_ARCH}"
          mkdir -p dist
          cp target/release/larql dist/
          cp target/release/larql-server dist/
          tar -czf "${ARCHIVE_BASENAME}.tar.gz" -C dist larql larql-server
          echo "ARCHIVE_NAME=${ARCHIVE_BASENAME}.tar.gz" >> "$GITHUB_ENV"

      - name: Package binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "manual" }
          $archiveBasename = "larql-$tag-$env:RUNNER_OS-$env:RUNNER_ARCH"
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item target/release/larql.exe dist/
          Copy-Item target/release/larql-server.exe dist/
          Compress-Archive -Path dist/* -DestinationPath "$archiveBasename.zip" -Force
          "ARCHIVE_NAME=$archiveBasename.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload release archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ runner.os }}-${{ runner.arch }}
          path: larql-main/${{ env.ARCHIVE_NAME }}

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_release == 'true')
    timeout-minutes: 20
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: release-artifacts

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@f6c3d0fe42c3cf876e3462574e4c9416b5e0f07a
        with:
          path: release-artifacts
          format: spdx-json
          output-file: release-artifacts/SBOM.spdx.json

      - name: Generate checksums
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          : > SHA256SUMS.txt
          for file in release-artifacts/**/*; do
            if [ -f "$file" ]; then
              sha256sum "$file" >> SHA256SUMS.txt
            fi
          done

      - name: Attest release artifacts provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: |
            release-artifacts/**/*
            SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            release-artifacts/**/*
            SHA256SUMS.txt
